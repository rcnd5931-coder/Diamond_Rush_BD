        .header { background-color: #4a148c; color: white; padding: 15px; text-align: center; }
        .notice-banner { width: 100%; margin: 10px 0; }
        .support-links { display: flex; justify-content: space-around; padding: 10px; background: white; }

        .offer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; }
        .offer-card { background: white; border-radius: 10px; overflow: hidden; text-align: center; padding: 10px; }

        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #666; font-size: 12px; }
        .nav-item.active { color: #4a148c; }
        .nav-icon { font-size: 20px; }

        .floating-support { position: fixed; bottom: 80px; right: 20px; }
        .floating-support a { background: #4a148c; color: white; padding: 10px 15px; border-radius: 50px; text-decoration: none; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    </style>
